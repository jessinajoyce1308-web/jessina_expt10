<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Web Page</title>

    <link rel="icon" type="image/png"
    href="https://img.freepik.com/free-vector/gradient-t-logo-template_23-2149372726.jpg">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }

        input {
            padding: 10px;
            width: 250px;
            border-radius: 10px;
            font-size: x-large;
        }

        button {
            padding: 10px 15px;
            margin-left: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            font-size: x-large;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: lightgreen;
            margin: 5px auto;
            width: 300px;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <h2 style="font-size: xx-large;">Dynamic To-Do List</h2>

    <input type="text" id="taskInput" placeholder="Enter a task">

    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>

    <script>
        function addTask() {
            let taskInput = document.getElementById("taskInput");
            let taskList = document.getElementById("taskList");

            if (taskInput.value.trim() === "") {
                alert("Please enter a task");
                return;
            }

            let li = document.createElement("li");
            li.innerText = taskInput.value.trim();

            taskList.appendChild(li);

            taskInput.value = "";
        }
    </script>
</body>
</html>
